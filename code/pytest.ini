[pytest]
# Run the tests for the changed code area, or on request.
# Slow convergence checks and external mass-radius benchmarks are opt-in.
# Explicit -m expressions on the command line override the default selection.
markers =
    slow: spatial-convergence validation; select with -m slow
    benchmark: external mass-radius reference checks; select with -m benchmark
addopts = -m "not slow and not benchmark"
